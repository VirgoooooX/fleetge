<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050914" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("hd-theme");
          var t = s === "dark" || s === "light"
            ? s
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          var r = document.documentElement;
          r.dataset.theme = t;
          r.classList.toggle("dark", t === "dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#050914" : "#f5f7fa");
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/app-logo.svg" />
    <link rel="mask-icon" href="/app-logo-mask.svg" color="#2563eb" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-logo-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Fleetge</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
